name: Release private assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release type (base also builds a patch when a release exists)'
        type: choice
        options: [patch, base]
        default: patch
      publish:
        description: 'Upload to R2 and switch latest (false builds and validates only)'
        type: boolean
        default: false
      base_compatible:
        description: 'Confirmed that rebuilding base is compatible with supported clients'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mash-data-pipeline
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: assets-release
    timeout-minutes: 120
    outputs:
      version: ${{ steps.summary.outputs.version }}
      data_commit: ${{ steps.summary.outputs.data_commit }}
    env:
      PRIVATE_DATA_BRANCH: ${{ vars.PRIVATE_DATA_BRANCH || 'main' }}
      AWS_PROFILE: ''
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PREFIX: ${{ vars.R2_PREFIX || 'mash' }}
      ASSETS_PREFIX: ${{ vars.ASSETS_PREFIX || 'assets' }}
    steps:
      - name: Check private repository configuration
        env:
          PRIVATE_DATA_REPOSITORY: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          PRIVATE_DATA_WRITE_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if [[ -z "$PRIVATE_DATA_REPOSITORY" ]]; then
            echo '::error::PRIVATE_DATA_REPOSITORY is required (owner/repo)'
            exit 1
          fi
          if [[ "$PUBLISH_REQUESTED" == 'true' && -z "$PRIVATE_DATA_WRITE_TOKEN" ]]; then
            echo '::error::PRIVATE_DATA_WRITE_TOKEN is required to write back the published manifest and version'
            exit 1
          fi

      - name: Check out tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          python -m pip install -r scripts/requirements-pipeline.txt
          aws --version
      - name: Check release tools
        run: python -m unittest discover -s scripts/tests -v

      - name: Check out latest private snapshot
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          token: ${{ secrets.PRIVATE_DATA_READ_TOKEN }}
          path: private-data
          persist-credentials: false
          fetch-depth: 1

      - name: Validate existing snapshot
        env:
          MASH_DATA_ROOT: ${{ github.workspace }}/private-data
        run: |
          npm run verify:variants

      - name: Auto-increment version and build release
        env:
          MASH_DATA_ROOT: ${{ github.workspace }}/private-data
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_MODE: ${{ inputs.mode }}
          BASE_COMPATIBLE: ${{ inputs.base_compatible }}
        run: |
          args=(prepare --mode "$RELEASE_MODE")
          if [[ "$BASE_COMPATIBLE" == 'true' ]]; then args+=(--base-compatible); fi
          python scripts/pipeline_release.py "${args[@]}"

      - name: Publish verified release
        if: inputs.publish
        env:
          MASH_DATA_ROOT: ${{ github.workspace }}/private-data
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/pipeline_release.py publish

      - name: Summarize release
        id: summary
        env:
          PUBLISHED: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          context = json.loads(Path('private-data/dist/release-context.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={context['version']}\ndata_commit={context['dataCommit']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Release: v{context['previousVersion']} → v{context['version']} ({context['mode']})\n\n")
              if context['patch']:
                  output.write(f"Patch: v{context['patch']['from']} → v{context['patch']['to']}\n\n")
              output.write(f"Published: {os.environ['PUBLISHED']}\n\nPrivate commit: `{context['dataCommit']}`\n\n")
              output.write(f"Code commit: `{context['codeCommit']}`\n\nDeleted asset files: {context['deleted']}\n")
          PY

  writeback:
    name: Write published manifest and version to private
    needs: release
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: assets-release
    timeout-minutes: 15
    env:
      PRIVATE_DATA_BRANCH: ${{ vars.PRIVATE_DATA_BRANCH || 'main' }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_DATA_COMMIT: ${{ needs.release.outputs.data_commit }}
      AWS_PROFILE: ''
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PREFIX: ${{ vars.R2_PREFIX || 'mash' }}
      ASSETS_PREFIX: ${{ vars.ASSETS_PREFIX || 'assets' }}
    steps:
      - name: Check out tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check out current private branch for release metadata writeback
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_DATA_REPOSITORY }}
          ref: ${{ env.PRIVATE_DATA_BRANCH }}
          token: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN }}
          path: private-data
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            /assets/manifest.json
            /assets/version.json
          sparse-checkout-cone-mode: false

      - name: Stage verified published manifest and version
        id: sync
        env:
          MASH_DATA_ROOT: ${{ github.workspace }}/private-data
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/sync_release_manifest.py --version "$RELEASE_VERSION" --data-commit "$RELEASE_DATA_COMMIT"

      - name: Commit release metadata and push version tag
        id: push
        working-directory: private-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash ../scripts/push_release_metadata.sh

      - name: Summarize release metadata writeback
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          python - <<'PY'
          import os
          synced = os.environ['SYNC_OUTCOME'] == 'success' and os.environ['PUSH_OUTCOME'] == 'success'
          status = 'synchronized' if synced else 'failed; re-run this writeback job to retry without republishing'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"R2 release: published v{os.environ['RELEASE_VERSION']}\n\nPrivate manifest, version and tag v{os.environ['RELEASE_VERSION']}: {status}\n")
          if not synced:
              print(f"::error::Release v{os.environ['RELEASE_VERSION']} is already published; private manifest/version/tag sync failed. Re-run failed jobs to retry the writeback.")
          PY
